# =============================================================================
# Personal Blog - Nginx 站点配置
# 路径建议: /etc/nginx/conf.d/luliming.xyz.conf  (Debian/Ubuntu 也可放 sites-available)
#
# 设计原则（重要）：
# 1. 仅匹配 luliming.xyz / www.luliming.xyz 两个 server_name，不会拦截其他站点
# 2. 不修改 nginx.conf 主配置，仅新增一个独立文件 (drop-in)
# 3. 反向代理到 127.0.0.1:3100，进程仅本地监听，不暴露端口
# 4. 启用前必跑 `nginx -t`，失败即可直接删除本文件回滚
# =============================================================================

# HTTP -> HTTPS 跳转 + Let's Encrypt 验证
server {
    listen 80;
    listen [::]:80;
    server_name luliming.xyz www.luliming.xyz;

    # certbot webroot 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.luliming.xyz$request_uri;
    }
}

# 裸域 -> www 跳转（HTTPS）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name luliming.xyz;

    ssl_certificate     /etc/letsencrypt/live/luliming.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luliming.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://www.luliming.xyz$request_uri;
}

# 主站点
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.luliming.xyz;

    ssl_certificate     /etc/letsencrypt/live/luliming.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luliming.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_luliming:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 上传/请求体限制（按需调整）
    client_max_body_size 10m;

    # 静态资源长期缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js 应用主反代
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 独立访问日志，便于排查，不污染默认日志
    access_log /var/log/nginx/luliming.access.log;
    error_log  /var/log/nginx/luliming.error.log warn;
}
